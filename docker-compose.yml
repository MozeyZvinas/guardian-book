# Local Postgres 16 for development and integration tests. Loopback only; the password is
# dev-only and is never reused anywhere else. No volume: `docker compose down` gives a fresh
# database, which is what the integration tests expect.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian_dev_only
      POSTGRES_DB: guardian
    ports:
      # 5433 on the host (5432 is often taken by a local Postgres); 5432 inside the container.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 2s
      timeout: 3s
      retries: 20
