# CI (spec 04 §3). Six jobs; their `name:` values are the status checks the `main` ruleset
# requires: gitleaks, typecheck, lint, unit, integration, build-image.
# Hardening: read-only token, every third-party action pinned to a full commit SHA,
# pnpm 12.15 + Node 24 from the repo's own pins, frozen lockfile, no secrets in PR jobs.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks binary itself, pinned by version and release checksum: no GitHub API
      # access needed (the gitleaks-action wants pull-requests: read), and it scans the full
      # history plus the working tree on every run, exactly as run locally.
      - name: install gitleaks 8.30.1 (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks && rm gitleaks.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: gitleaks over the full git history
        run: gitleaks git --no-banner --redact --exit-code 1 .
      - name: gitleaks over the working tree
        run: gitleaks dir --no-banner --redact --exit-code 1 .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: audit (high or critical blocks)
        run: pnpm audit --prod --audit-level high

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guardian
          POSTGRES_PASSWORD: guardian_dev_only
          POSTGRES_DB: guardian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guardian -d guardian"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Loopback only: the harness refuses anything else.
      DATABASE_URL: postgres://guardian:guardian_dev_only@127.0.0.1:5432/guardian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  build-image:
    name: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: bundle secret scan
        run: node scripts/check-bundle-secrets.mjs apps/web/dist
      - name: docker build (no push)
        run: docker build -t guardian-book:ci .
      - name: smoke test the image with zero env
        run: |
          set -euo pipefail
          docker run -d --name gb -p 8080:8080 guardian-book:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > healthz.json 2>/dev/null; then break; fi
            sleep 1
          done
          cat healthz.json; echo
          grep -q '"ok":true' healthz.json
          grep -q '"configured":{"db":false,"auth":false,"meta":false,"bucket":false}' healthz.json
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Guardian Book'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/evidence | grep -q '^200$'
      - name: container logs
        if: always()
        run: docker logs gb 2>&1 | tail -n 50 || true
      - name: stop container
        if: always()
        run: docker rm -f gb || true
