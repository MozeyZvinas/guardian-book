<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Guardian Book</title>
    <meta
      name="description"
      content="Every learner deserves the support to succeed. A student success and guidance platform for high schools: for learners, their parents and their teachers."
    />

    <!-- A shared link on WhatsApp or X (brief B09 §5): title, description, a 1200×630 card from the hero. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Guardian Book" />
    <meta property="og:title" content="Guardian Book · Every learner deserves the support to succeed." />
    <meta
      property="og:description"
      content="A student success and guidance platform for high schools: for learners, their parents and their teachers. Built during the Meta Global AI Developer Hackathon with Muse Spark by Meta."
    />
    <meta property="og:url" content="https://guardianbook.app/" />
    <meta property="og:image" content="https://guardianbook.app/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Guardian Book: Every learner deserves the support to succeed." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Guardian Book · Every learner deserves the support to succeed." />
    <meta name="twitter:description" content="A student success and guidance platform for high schools: for learners, their parents and their teachers." />
    <meta name="twitter:image" content="https://guardianbook.app/og-card.png" />

    <!-- Install as an app (brief B09 §3; spec 06 §5). theme-color is kept on the ground token by src/sw/register.ts. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="white" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Guardian Book" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />

    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/sw/register.ts"></script>
  </body>
</html>
